[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
evm_version = "cancun"

[profile.default.fmt]
wrap_comments = true

[lint]
exclude_lints = [
    "unused-import",
    "unaliased-plain-import",
    "mixed-case-variable",
    "mixed-case-function",
    "asm-keccak256",
]

[fuzz]
runs = 10_000
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
